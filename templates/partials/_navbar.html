<!-- Signora v2 — Shared Navigation Bar -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('index') }}">
            <img src="{{ url_for('static', filename='img/signora-logo.svg') }}" alt="" class="brand-mark" width="34" height="34">
            <span class="brand-word">Sign<span>ora</span></span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}"
                        href="{{ url_for('index') }}">
                        <i class="fas fa-hand-paper me-1"></i> Sign to Text
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'text_to_sign' %}active{% endif %}"
                        href="{{ url_for('text_to_sign') }}">
                        <i class="fas fa-hands me-1"></i> Text to Sign
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <button id="emergency-alert-btn" class="btn btn-danger btn-sm" type="button">
                    <i class="fas fa-triangle-exclamation me-1" aria-hidden="true"></i>Emergency Alert
                </button>
                <span id="emergency-alert-status" class="visually-hidden" role="status" aria-live="polite"></span>
                <button id="theme-toggle" class="btn btn-sm" title="Toggle theme"
                    style="background:none; border:1px solid var(--border); color:var(--text-primary); border-radius:50%; width:36px; height:36px; padding:0;">
                    <i class="fas fa-moon" id="theme-icon"></i>
                </button>
            </div>
        </div>
    </div>
</nav>
<script>
    (function () {
        const toggle = document.getElementById('theme-toggle');
        const icon = document.getElementById('theme-icon');
        if (!toggle || !icon) return;

        const saved = localStorage.getItem('signora-theme') || 'dark';
        applyTheme(saved);

        toggle.addEventListener('click', () => {
            const current = document.body.dataset.theme || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            applyTheme(next);
            localStorage.setItem('signora-theme', next);
        });

        function applyTheme(theme) {
            document.body.dataset.theme = theme;
            if (icon) icon.className = theme === 'light' ? 'fas fa-sun' : 'fas fa-moon';
        }
    })();
</script>
<script src="{{ url_for('static', filename='js/emergency-alert.js') }}?v=3"></script>
