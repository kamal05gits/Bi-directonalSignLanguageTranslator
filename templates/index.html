<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signora — Sign to Text</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    {% include 'partials/_head.html' %}
</head>

<body>
    {% include 'partials/_navbar.html' %}

    <div class="container-fluid mt-3">
        <div class="row align-items-stretch">
            <!-- LEFT: Camera + Metrics -->
            <div class="col-lg-7 d-flex mb-3">
                <div class="card w-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="fas fa-video me-2"></i>Live Camera Feed
                        </h5>
                        <div class="d-flex flex-wrap gap-3 align-items-center justify-content-end">
                            <div class="d-flex align-items-center gap-2">
                                <label for="recognition-model-select" class="small mb-0">Model</label>
                                <select id="recognition-model-select" class="form-select form-select-sm"
                                    style="width:auto; max-width:230px;" disabled>
                                    <option>Loading models...</option>
                                </select>
                                <span id="recognition-model-status" class="small text-muted" role="status"
                                    aria-live="polite"></span>
                            </div>
                            <!-- Inline metrics -->
                            <div class="d-flex gap-3 align-items-center" style="font-size: 0.8em;">
                                <span title="FPS"><i class="fas fa-tachometer-alt" style="color:var(--primary);"></i> <span
                                        id="avg-fps">--</span></span>
                                <span title="Accuracy"><i class="fas fa-bullseye" style="color:var(--accent);"></i> <span
                                        id="accuracy">--</span></span>
                                <span title="Latency"><i class="fas fa-clock" style="color:#d97706;"></i> <span
                                        id="latency">--</span></span>
                            </div>
                        </div>
                    </div>
                    <div class="card-body text-center p-2 d-flex flex-column">
                        <div id="camera-selector" class="mb-2 text-start"></div>
                        <div class="video-container flex-grow-1 d-flex align-items-center justify-content-center">
                            <video id="video-stream" autoplay playsinline muted
                                style="width:100%; border-radius: var(--radius-lg);"></video>
                            <div class="video-overlay">
                                <div class="status-indicator" id="camera-status">
                                    <i class="fas fa-circle text-warning" style="font-size:0.6em;"></i>
                                    Starting camera...
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT: Recognition + Text + Suggestions -->
            <div class="col-lg-5 d-flex flex-column mb-3">
                <!-- Recognition Results -->
                <div class="card mb-2" style="flex:0 0 auto;">
                    <div class="card-header" style="background: var(--gradient-accent);">
                        <h5 class="mb-0">
                            <i class="fas fa-hand-sparkles me-2"></i>Recognition Results
                        </h5>
                    </div>
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center gap-4">
                            <div class="text-center" style="min-width:80px;">
                                <div id="current-character" class="display-4"
                                    style="font-weight:800; color:var(--primary);">--</div>
                                <small id="current-character-label" style="color:var(--text-muted);">Detected</small>
                            </div>
                            <div class="flex-grow-1">
                                <label style="font-size:0.8em; color:var(--text-muted);">Confidence</label>
                                <div class="progress mt-1" style="height:12px;">
                                    <div id="confidence-bar" class="progress-bar bg-success" role="progressbar"
                                        style="width: 0%">
                                        <span id="confidence-text" style="font-size:0.75em;">0%</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div id="emergency-recognition-status" class="small mt-2" role="status"
                            aria-live="polite"></div>
                    </div>
                </div>

                <!-- Text Output -->
                <div class="card mb-2" style="flex:0 0 auto;">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-comment-dots me-2"></i>Text Output
                        </h5>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <div class="mb-2">
                            <label for="sentence-display" class="form-label"
                                style="font-weight:600; color:var(--text-secondary); font-size:0.85em; text-transform:uppercase; letter-spacing:1px;">
                                <i class="fas fa-language me-1"></i> Recognized Text:
                            </label>
                            <textarea id="sentence-display" class="form-control"
                                style="height:96px; min-height:64px; flex:none;"
                                placeholder="Recognized text will appear here..." readonly></textarea>
                            <label for="translated-display" class="form-label mt-2 mb-1"
                                style="font-weight:600; color:var(--text-secondary); font-size:0.85em; text-transform:uppercase; letter-spacing:1px;">
                                <i class="fas fa-globe me-1"></i> Translated Text:
                            </label>
                            <textarea id="translated-display" class="form-control" rows="2"
                                style="height:68px; min-height:56px; flex:none;" readonly
                                placeholder="Translated text will appear here..."></textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <div class="row g-2 align-items-end">
                                <div class="col-12">
                                    <label for="voice-language" class="form-label mb-1">Voice language</label>
                                    <select id="voice-language" class="form-select">
                                        <option value="en" data-locale="en-IN">English</option>
                                        <option value="ta" data-locale="ta-IN">Tamil</option>
                                        <option value="te" data-locale="te-IN">Telugu</option>
                                        <option value="hi" data-locale="hi-IN">Hindi</option>
                                        <option value="kn" data-locale="kn-IN">Kannada</option>
                                        <option value="ml" data-locale="ml-IN">Malayalam</option>
                                        <option value="bn" data-locale="bn-IN">Bengali</option>
                                        <option value="ur" data-locale="ur-PK">Urdu</option>
                                    </select>
                                </div>
                            </div>
                            <div class="d-flex gap-2">
                                <button id="listen-btn" class="btn btn-outline-primary flex-fill" type="button">
                                    <i class="fas fa-microphone me-2"></i>Speak to Text
                                </button>
                                <button id="speak-btn" class="btn btn-lg flex-fill"
                                style="background:var(--gradient-accent);color:white;">
                                    <i class="fas fa-volume-up me-2"></i>Speak Text
                                </button>
                            </div>
                            <div id="voice-status" class="small text-muted" role="status" aria-live="polite">
                                Choose a language to speak or listen.
                            </div>
                            <div class="d-flex gap-2">
                                <button id="backspace-btn" class="btn flex-fill"
                                    style="background:linear-gradient(135deg,#6366f1,#818cf8);color:white;"
                                    title="Remove last character">
                                    <i class="fas fa-backspace me-1"></i>Backspace
                                </button>
                                <button id="clear-btn" class="btn flex-fill"
                                    style="background:var(--gradient-warm);color:white;">
                                    <i class="fas fa-eraser me-1"></i>Clear All
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Word Suggestions -->
                <div class="card" style="flex:0 0 auto;">
                    <div class="card-header" style="background: var(--gradient-accent);">
                        <h5 class="mb-0">
                            <i class="fas fa-lightbulb me-2"></i>Word Suggestions
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="suggestions" class="d-flex flex-wrap gap-2">
                            <!-- Dynamic suggestions -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <footer class="text-center py-3 mt-3" style="color: var(--text-muted); font-size:0.85em;">
        <i class="fas fa-heart" style="color:#ef4444;"></i> Signora — Made for the deaf & hearing-impaired community
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/camera.js') }}?v=4"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}?v=15"></script>
</body>

</html>
