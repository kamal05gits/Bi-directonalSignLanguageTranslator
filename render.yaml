# Lean deployment: alphabet photo model + hand-landmark fingerspelling model.
# To also deploy the CISLR word model, set the Dockerfile default
# `ARG WITH_WORD_MODEL=true` before deploying and use at least the Standard
# plan (TensorFlow + PyTorch need more memory than Starter provides).
services:
  - type: web
    name: signbridge-isl-translator
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: CONFIDENCE_THRESHOLD
        value: "0.70"
      - key: PYTHON_VERSION
        value: "3.11.11"
      # Twilio emergency alerts: set these to deliver SMS + voice calls to your
      # own number. Without them, emergency phrases stay on-screen/spoken only.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: EMERGENCY_TO_NUMBER
        sync: false
      - key: EMERGENCY_SMS_ENABLED
        value: "true"
      - key: EMERGENCY_VOICE_CALL_ENABLED
        value: "true"
