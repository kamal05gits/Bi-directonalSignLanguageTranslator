services:
  - type: web
    name: signbridge-isl-translator
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: CONFIDENCE_THRESHOLD
        value: "0.70"
      - key: PYTHON_VERSION
        value: "3.11.11"
