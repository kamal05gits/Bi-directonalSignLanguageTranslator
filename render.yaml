# Lean deployment: alphabet photo model + hand-landmark fingerspelling model.
# To also deploy the CISLR word model, set the Dockerfile default
# `ARG WITH_WORD_MODEL=true` before deploying and use at least the Standard
# plan (TensorFlow + PyTorch need more memory than Starter provides).
services:
  - type: web
    name: signbridge-isl-translator
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # autoDeploy: true deploys every push to main immediately. To gate deploys
    # on CI instead (lint + tests + Docker smoke test must pass first), set
    # this to false, create a Deploy Hook on the service (Settings -> Deploy
    # Hook), and save its URL as the GitHub secret RENDER_DEPLOY_HOOK_URL.
    # The `deploy` job in .github/workflows/ci.yml does the rest.
    autoDeploy: true
    envVars:
      - key: CONFIDENCE_THRESHOLD
        value: "0.70"
      - key: PYTHON_VERSION
        value: "3.11.11"
      # Optional Roboflow-hosted ISL detector. Enter the secret in the Render
      # dashboard; never commit it here or put it in frontend JavaScript.
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: ROBOFLOW_MODEL_ID
        value: "indian-sign-language_40/1"
      - key: ROBOFLOW_API_URL
        value: "https://serverless.roboflow.com"
      - key: ROBOFLOW_CONFIDENCE
        value: "0.25"
      - key: ROBOFLOW_OVERLAP
        value: "0.50"
      # Twilio emergency alerts: set these to deliver SMS + voice calls to your
      # own number. Without them, emergency phrases stay on-screen/spoken only.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: EMERGENCY_TO_NUMBER
        sync: false
      - key: EMERGENCY_SMS_ENABLED
        value: "true"
      - key: EMERGENCY_VOICE_CALL_ENABLED
        value: "true"
