name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Superseded runs on the same branch are cancelled so pushes don't queue up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------- fast gate
  lint:
    name: Lint & static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Ruff (correctness rules, see ruff.toml)
        run: |
          python -m pip install ruff
          ruff check backend tests
      - name: Compile Python sources
        run: python -m compileall -q backend
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check browser JavaScript
        run: node --check frontend/assets/app.js

  # ----------------------------------------------- graceful-degradation tests
  # The suite must pass WITHOUT TensorFlow/Twilio installed: the app promises
  # to degrade honestly when optional dependencies are missing, and this job
  # is what holds it to that promise.
  test-minimal:
    name: Tests (minimal deps)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies only
        run: python -m pip install pytest numpy
      - name: Run unit tests
        run: python -m pytest -q

  # ----------------------------------------------------- full-dependency tests
  # Same suite with the real production requirements (TensorFlow, Twilio,
  # FastAPI stack) so model loading and the API surface are exercised the way
  # Render runs them.
  test-full:
    name: Tests (full deps)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install production + test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest httpx
      - name: Run unit tests
        run: python -m pytest -q

  # -------------------------------------------------------- deployment image
  # Build the exact lean Docker image Render deploys, boot it, and smoke-test
  # the health check, the static frontend, and a real alphabet prediction.
  docker-smoke:
    name: Docker build & smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build lean image (same as Render)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: signora:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot container
        run: |
          docker run -d --name signora -p 10000:10000 signora:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:10000/api/health > /dev/null 2>&1; then
              echo "server is up after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::server did not come up within 30s"
              docker logs signora
              exit 1
            fi
            sleep 1
          done
      - name: Health check reports alphabet + fingerspelling models available
        run: |
          health=$(curl -fsS http://localhost:10000/api/health)
          echo "$health"
          echo "$health" | python3 -c '
          import json, sys
          h = json.load(sys.stdin)
          assert h["status"] == "ok", h
          assert h["models"]["alphabet"]["available"], h
          assert h["models"]["fingerspelling"]["available"], h
          print("health check OK")
          '
      - name: Frontend is served
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:10000/)
          test "$code" = "200" || { echo "::error::frontend returned $code"; exit 1; }
          curl -fsS http://localhost:10000/assets/app.js > /dev/null
      - name: Real prediction round-trip (loads the model inside the image)
        run: |
          python3 -m pip install --quiet pillow
          python3 -c '
          import io
          from PIL import Image
          img = Image.new("RGB", (64, 64), (128, 100, 90))
          img.save("/tmp/smoke.jpg", "JPEG")
          '
          response=$(curl -fsS -F "file=@/tmp/smoke.jpg" http://localhost:10000/api/predict/alphabet)
          echo "$response"
          echo "$response" | python3 -c '
          import json, sys
          r = json.load(sys.stdin)
          assert "label" in r and "confidence" in r and "top_predictions" in r, r
          print("prediction round-trip OK")
          '
      - name: Container logs
        if: always()
        run: docker logs signora || true

  # ------------------------------------------------------------------ deploy
  # Optional CI-gated deploy: create a Deploy Hook on the Render service
  # (Settings -> Deploy Hook), save its URL as the repository secret
  # RENDER_DEPLOY_HOOK_URL, and set `autoDeploy: false` in render.yaml.
  # Render then only deploys main after every job above is green.
  # Without the secret this job is a no-op and Render's own autoDeploy
  # (currently enabled in render.yaml) keeps working as before.
  deploy:
    name: Deploy to Render (main only)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [lint, test-minimal, test-full, docker-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set - skipping."
            echo "Render's autoDeploy (render.yaml) handles deployment instead."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy triggered."
